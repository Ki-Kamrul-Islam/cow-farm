<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cow Farm Management</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx">
                  // React লোড হওয়ার আগেই সঠিক theme বসিয়ে দেয় (সাদা ঝলকানি আটকাতে)
            (function () {
              try {
                var saved = JSON.parse(localStorage.getItem('cowfarm:theme'));
                var dark = saved
                  ? saved === 'dark'
                  : window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (dark) document.documentElement.classList.add('dark');
              } catch (e) {}
            })();
        </script>
    </body>
</html>
